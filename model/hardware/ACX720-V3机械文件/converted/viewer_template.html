<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACX720 机械文件 · 离线 3D 查看</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#26313d;font:15px/1.65 system-ui,sans-serif}header{padding:18px 26px;background:#fff;border-bottom:1px solid #dce1e7;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:21px;margin:0;font-weight:650}header span{font-size:13px;color:#667281}main{display:grid;grid-template-columns:310px minmax(0,1fr);height:calc(100vh - 82px);min-height:540px}aside{padding:24px;background:#fff;border-right:1px solid #dce1e7;overflow:auto}h2{font-size:17px;margin:0 0 12px}p{margin:12px 0}button,select{font:inherit;border:1px solid #cbd4de;border-radius:6px;background:#fff;color:inherit;padding:8px 12px;cursor:pointer}button:hover{background:#edf2f6}button[aria-pressed=true]{background:#25394d;color:white;border-color:#25394d}.versions{display:flex;gap:8px}.versions button{flex:1}.notice{font-size:13px;color:#785b28;background:#fff6e3;padding:13px 14px;border-left:3px solid #d3a44e;margin:18px 0}.spec{font-size:13px;color:#566575;white-space:pre-line}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}label{display:block;margin:10px 0;font-size:14px}input{margin-right:8px}a{color:#285d86;text-decoration:none}a:hover{text-decoration:underline}.downloads{display:flex;gap:16px;margin:16px 0;font-size:14px}.hint{font-size:12px;color:#73818c;margin-top:22px}.stage{position:relative;min-height:430px;overflow:hidden;background:linear-gradient(#e7edf2,#f8fafc)}canvas{display:block;width:100%;height:100%;touch-action:none;outline-offset:-5px}.overlay{position:absolute;left:22px;top:17px;pointer-events:none;color:#526575;font-size:13px}.axis{position:absolute;right:20px;bottom:20px;font-size:12px;color:#657583;pointer-events:none}#status{font-size:12px;color:#4c775d;margin-top:20px}#error{color:#942c2c;white-space:pre-wrap}footer{font-size:12px;color:#78848d;margin-top:18px}code{font-family:ui-monospace,monospace}@media(max-width:780px){header{padding:14px 18px}header span{display:none}main{display:flex;flex-direction:column;height:auto}aside{padding:18px;border-right:0}.stage{height:58vh;min-height:400px}.hint{margin-top:8px}.notice{margin:12px 0}.spec{white-space:normal}h1{font-size:19px}}
</style>
</head>
<body>
<header><h1>ACX720 / 机械文件</h1><span>离线查看 · 无需上传文件 · 尺寸单位 mm</span></header>
<main>
<aside>
<h2>选择源文件版本</h2>
<div class="versions"><button id="v2" aria-pressed="true">V2 包络模型</button><button id="v3" aria-pressed="false">V3 平面参考</button></div>
<p class="spec" id="spec"></p>
<div class="notice" id="notice"></div>
<div class="controls"><button id="iso">等轴视图</button><button id="top">俯视</button><button id="bottom">底视</button><button id="reset">重置</button></div>
<label><input id="bodies" type="checkbox" checked>显示器件包络</label>
<label><input id="mounts" type="checkbox">显示安装孔包络（非器件）</label>
<div class="downloads"><a id="step" href="acx720_v2_reference.step" download>STEP 文件</a><a id="glb" href="acx720_v2_reference.glb" download>GLB 文件</a></div>
<a href="acx720_v3_drawing.svg" target="_blank">查看 V3 完整二维图纸 ↗</a>
<div class="hint">拖动旋转 · 滚轮缩放 · 右键拖动平移<br>双击重置。键盘方向键旋转，＋ / － 缩放。</div>
<div id="status" role="status" aria-live="polite">正在加载本地模型…</div>
<div id="error" role="alert"></div>
<footer>V2 与 V3 外形尺寸不同，请勿混用。<br>本模型用于资料查看，不作为加工或装配验收依据。</footer>
</aside>
<section class="stage" id="stage" aria-label="可交互的三维模型"><div class="overlay" id="caption"></div><canvas id="view" tabindex="0" aria-label="模型视图，方向键可旋转，加减键可缩放"></canvas><div class="axis">X → &nbsp; Y ↗ &nbsp; Z ↑</div></section>
</main>
<script src="vendor/three.min.js"></script>
<script id="model-data" type="application/json">__MODEL_DATA__</script>
<script>
"use strict";
try {
if (!window.THREE) throw new Error("无法读取本地 three.min.js。请保留整个 converted 文件夹后重新打开。");
const data=JSON.parse(document.getElementById("model-data").textContent);
const canvas=document.getElementById("view"),stage=document.getElementById("stage");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.01,2000);camera.up.set(0,0,1);
scene.add(new THREE.HemisphereLight(0xffffff,0x718195,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-60,-100,230);scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,.7);fill.position.set(100,50,-100);scene.add(fill);
let group=new THREE.Group();scene.add(group);let current="v2",theta=-1.0,phi=.88,distance=270,target=new THREE.Vector3(75,54,1),extent=150;
function draw(){const s=Math.sin(phi);camera.position.set(target.x+distance*s*Math.cos(theta),target.y+distance*s*Math.sin(theta),target.z+distance*Math.cos(phi));camera.lookAt(target);renderer.render(scene,camera);window.modelViewerState={version:current,meshes:group.children.filter(x=>x.isMesh).length,visibleMeshes:group.children.filter(x=>x.isMesh&&x.visible).length,theta,phi,distance,rendered:true};}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();draw();}
function reset(){theta=-1.0;phi=.88;target.set(current==="v2"?74.93:69.0245,current==="v2"?54.61:45.7835,current==="v2"?1.5:0);distance=extent*(camera.aspect<1?2.4/camera.aspect:1.95);draw();}
function visibility(){for(const m of group.children){if(m.userData.kind==="component_envelope")m.visible=document.getElementById("bodies").checked;if(m.userData.kind==="mount_envelope")m.visible=document.getElementById("mounts").checked;}draw();}
function load(version){current=version;scene.remove(group);for(const object of group.children){object.geometry?.dispose();if(Array.isArray(object.material))object.material.forEach(m=>m.dispose());else object.material?.dispose();}group=new THREE.Group();scene.add(group);
 for(const item of data[version]){const geometry=new THREE.BufferGeometry();geometry.setAttribute("position",new THREE.Float32BufferAttribute(item.vertices,3));geometry.setIndex(item.indices);geometry.computeVertexNormals();const mount=item.kind==="mount_envelope";const material=new THREE.MeshStandardMaterial({color:new THREE.Color(...item.color),metalness:.1,roughness:.75,side:THREE.DoubleSide,transparent:mount,opacity:mount?.3:1,depthWrite:!mount});const mesh=new THREE.Mesh(geometry,material);mesh.name=item.name;mesh.userData.kind=item.kind;group.add(mesh);const edgeGeo=new THREE.EdgesGeometry(geometry,32);if(!mount){const edges=new THREE.LineSegments(edgeGeo,new THREE.LineBasicMaterial({color:0x3d515e,transparent:true,opacity:.35}));edges.userData.kind=item.kind;group.add(edges);}else edgeGeo.dispose();}
 if(version==="v3"){const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.Float32BufferAttribute(data.v3_lines,3));group.add(new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0xd9edf0})));}
 document.getElementById("v2").setAttribute("aria-pressed",String(version==="v2"));document.getElementById("v3").setAttribute("aria-pressed",String(version==="v3"));
 const v2=version==="v2";document.getElementById("spec").textContent=v2?"来源：ACX720-v2机械文件.PcbDoc\n板框：149.861 × 109.220 mm\n29 个器件包络 + 4 个安装孔包络":"来源：ACX720-V3.DWG\n板框：138.049 × 91.567 mm\n206 个孔位图元 · Z = 0";
 document.getElementById("notice").textContent=v2?"源文件中的简化包络统一高 3.81 mm，导入层叠厚度为 0.28416 mm，均未核实为实物尺寸。这不是精细器件模型。":"原文件只有二维信息，因此保留为零厚度平面。12 个自交槽孔轮廓仅保留线框，未猜测修复；未借用 V2 高度或猜测 V3 厚度。";
 document.getElementById("caption").textContent=v2?"V2 / 源文件简化包络":"V3 / 零厚度平面参考";
 const stem=v2?"acx720_v2_reference":"acx720_v3_planar_reference";for(const ext of ["step","glb"])document.getElementById(ext).href=stem+"."+ext;
 document.getElementById("bodies").disabled=!v2;document.getElementById("mounts").disabled=!v2;extent=v2?150:138.049;visibility();reset();document.getElementById("status").textContent="已载入 · "+(v2?"板体与 33 个源包络":"V3 平面与源图纸线条");}
document.getElementById("v2").onclick=()=>load("v2");document.getElementById("v3").onclick=()=>load("v3");document.getElementById("reset").onclick=reset;document.getElementById("iso").onclick=reset;document.getElementById("top").onclick=()=>{phi=.0001;theta=-Math.PI/2;draw();};document.getElementById("bottom").onclick=()=>{phi=Math.PI-.0001;theta=-Math.PI/2;draw();};document.getElementById("bodies").onchange=visibility;document.getElementById("mounts").onchange=visibility;
let drag=null;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};canvas.focus();};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(drag.pan){const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);target.addScaledVector(right,-dx*distance/stage.clientHeight*.65);target.addScaledVector(up,dy*distance/stage.clientHeight*.65);}else{theta-=dx*.006;phi=Math.max(.0001,Math.min(Math.PI-.0001,phi+dy*.006));}draw();};canvas.oncontextmenu=e=>e.preventDefault();canvas.addEventListener("wheel",e=>{e.preventDefault();distance=Math.max(10,Math.min(1500,distance*Math.exp(e.deltaY*.001)));draw();},{passive:false});canvas.ondblclick=reset;canvas.onkeydown=e=>{if(e.key==="ArrowLeft")theta-=.12;else if(e.key==="ArrowRight")theta+=.12;else if(e.key==="ArrowUp")phi=Math.max(.001,phi-.12);else if(e.key==="ArrowDown")phi=Math.min(Math.PI-.001,phi+.12);else if(e.key==="+"||e.key==="=")distance*=.9;else if(e.key==="-")distance*=1.1;else return;e.preventDefault();draw();};new ResizeObserver(resize).observe(stage);resize();load("v2");
} catch(error){document.getElementById("error").textContent="查看器启动失败："+error.message+"\n可用支持 STEP/GLB 的 CAD 或 3D 软件打开同目录模型文件。";document.getElementById("status").textContent="加载失败";console.error(error);}
</script>
</body>
</html>
