<script>
'use strict';
const parts=JSON.parse(document.getElementById('rc-data').textContent);
const byRef=new Map(parts.map(p=>[p.ref,p]));
const storageKey='PCB1-RC-20261009-82k-11k1-v1';
const state={kind:'all',pkg:'all',status:'all',query:'',grouped:false,selected:['R2'],records:{}};
let undoRecords=null,toastTimer=null,pan=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normal=s=>String(s).toLowerCase().replace(/\s/g,'').replace(/[μµ]/g,'u').replace(/[ωΩ]/g,'Ω');
const record=ref=>state.records[ref]||{};
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');for(const p of parts){const r=saved[p.ref];if(r&&typeof r==='object')state.records[p.ref]={checked:r.checked===true,actual:String(r.actual||''),memo:String(r.memo||'')}}}catch(e){$('storage-note').textContent='当前浏览器不支持保存记录；可用“导出核对记录”保存。底图为原板位置。'}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state.records))}catch(e){$('storage-note').textContent='记录仅保留在当前页面；可用“导出核对记录”保存。'}updateProgress()}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2400)}
function updateProgress(){const done=parts.filter(p=>record(p.ref).checked).length;$('done-count').textContent=done;$('progress-fill').style.width=(done/parts.length*100)+'%'}
function filtered(){const query=normal(state.query),exactRef=/^[rc]\d+$/.test(query);return parts.filter(p=>(state.kind==='all'||p.kind===state.kind)&&(state.pkg==='all'||p.package===state.pkg)&&(state.status==='all'||state.status==='done'&&record(p.ref).checked||state.status==='todo'&&!record(p.ref).checked||state.status==='issue'&&p.issue)&&(!query||(exactRef?normal(p.ref)===query:normal([p.ref,p.value,p.package,p.rating,p.role,p.module].join(' ')).includes(query))))}
function rowGroups(){const list=filtered();if(!state.grouped)return list.map(p=>[p]);const groups=new Map();for(const p of list){const key=[p.kind,p.value,p.package,p.rating].join('|');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)}return [...groups.values()]}
function renderTable(){const groups=rowGroups();const count=groups.reduce((n,g)=>n+g.length,0);$('view-count').textContent=state.grouped?`${groups.length} 组 / ${count} 件`:`${count} 件`;const selected=new Set(state.selected);$('parts-table').innerHTML=groups.length?groups.map(group=>{const refs=group.map(p=>p.ref),first=group[0],done=refs.every(r=>record(r).checked),some=refs.some(r=>record(r).checked),issue=group.some(p=>p.issue);return `<tr class="part ${refs.some(r=>selected.has(r))?'selected':''} ${done?'checked':''}" data-refs="${refs.join(',')}"><td><input type="checkbox" aria-label="核对 ${refs.join('、')}" ${done?'checked':''} data-part-check="${refs.join(',')}" data-mixed="${some&&!done}"></td><td><button class="refbtn">${refs.map(esc).join('、')}${group.length>1?`<span class="qty">${group.length} 件</span>`:''}</button></td><td>${issue?'<i class="dot"></i>':''}${esc(first.value)}</td><td>${esc(first.package)}${first.ref==='C58'?'<span class="qty">原焊盘</span>':''}</td><td>${esc(first.rating)}</td></tr>`}).join(''):'<tr><td class="empty" colspan="5">没有符合筛选的元件</td></tr>';$('parts-table').querySelectorAll('input[data-mixed="true"]').forEach(el=>el.indeterminate=true)}
function drawMarkers(){const visible=new Set(filtered().map(p=>p.ref)),selected=new Set(state.selected);$('part-markers').innerHTML=parts.map(p=>{const cls=['partmark',p.kind==='C'?'cap':'',p.issue?'issue':'',record(p.ref).checked?'checked':'',selected.has(p.ref)?'selected':''].join(' ');return `<g class="${cls}" data-ref="${p.ref}" tabindex="0" role="button" aria-label="定位 ${p.ref}，建议值 ${esc(p.value)}" opacity="${visible.has(p.ref)?1:.24}" transform="translate(${p.x} ${p.y}) rotate(${p.angle})"><title>${p.ref} · ${esc(p.value)} · ${p.package}</title><rect x="${-p.width/2}" y="${-p.height/2}" width="${p.width}" height="${p.height}" rx=".6"/></g>`}).join('');$('part-labels').innerHTML=$('show-labels').checked?parts.filter(p=>visible.has(p.ref)).map(p=>`<text class="ref-label" x="${p.x+1.5}" y="${p.y-5}">${p.ref}</text>`).join(''):''}
function renderDetail(){const selected=state.selected.map(r=>byRef.get(r)).filter(Boolean);if(!selected.length)return;const p=selected[0],r=record(p.ref),refs=selected.map(x=>x.ref);$('detail').innerHTML=`<div class="detailtop"><div><div class="detailref">${refs.join('、')}</div><div class="detailrole">${esc(p.role)}</div></div><div class="detailvalue"><small>建议装配值</small>${esc(p.value)}</div></div><div class="specrow"><span class="chip">${esc(p.package)}${p.ref==='C58'?' 原焊盘':''}</span><span class="chip">${esc(p.rating)}</span><span class="chip">${esc(p.module)}</span>${selected.some(x=>x.issue)?'<span class="chip warn">重点核对</span>':''}</div><p class="detailnote">${esc(p.note||'按建议值核对实装器件及焊接。')}</p>${p.issue?`<p class="original">原 BOM：${esc(p.original)}</p>`:''}${selected.length>1?`<div class="detail-members">${selected.map(x=>`<button data-detail-ref="${x.ref}">${x.ref} · ${esc(x.module)}</button>`).join('')}</div><p class="detailnote">点击单个位号查看其用途和记录。</p>`:`<div class="records"><label>实装值（可选）<input id="actual-value" aria-label="${p.ref} 实装值" value="${esc(r.actual)}" placeholder="按料袋或测量填写"></label><label>核对备注（可选）<input id="record-memo" aria-label="${p.ref} 核对备注" value="${esc(r.memo)}" placeholder="例如已换料、待补焊"></label></div>`}`}
function render(){renderTable();drawMarkers();renderDetail();updateProgress()}
function setView(x,y,w,h){$('board').setAttribute('viewBox',[x,y,w,h].join(' '))}
function getView(){return $('board').getAttribute('viewBox').split(/\s+/).map(Number)}
function focusRefs(refs){const selected=refs.map(r=>byRef.get(r));const xs=selected.map(p=>p.x),ys=selected.map(p=>p.y);const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;let w=Math.max(64,Math.max(...xs)-Math.min(...xs)+34),h=Math.max(49,Math.max(...ys)-Math.min(...ys)+26);const box=$('board').getBoundingClientRect(),ratio=box.width/box.height;if(w/h<ratio)w=h*ratio;else h=w/ratio;setView(cx-w/2,cy-h/2,w,h)}
function selectRefs(refs,zoom=true,scroll=false){state.selected=refs;render();if(zoom)focusRefs(refs);if(scroll){const row=[...$('parts-table').querySelectorAll('tr[data-refs]')].find(el=>el.dataset.refs.split(',').includes(refs[0]));if(row){const wrap=document.querySelector('.tablewrap'),rowRect=row.getBoundingClientRect(),wrapRect=wrap.getBoundingClientRect();if(rowRect.top<wrapRect.top+38||rowRect.bottom>wrapRect.bottom)wrap.scrollTop+=rowRect.top-wrapRect.top-38}}else if(window.matchMedia('(max-width:1080px)').matches){document.querySelector('.mapcard').scrollIntoView({block:'start',behavior:'smooth'})}}
$('parts-table').addEventListener('click',e=>{const row=e.target.closest('tr[data-refs]');if(!row)return;const refs=row.dataset.refs.split(',');if(e.target.matches('input[data-part-check]')){for(const ref of refs)state.records[ref]={...record(ref),checked:e.target.checked};save();render();return}selectRefs(refs)});
$('part-markers').addEventListener('click',e=>{const marker=e.target.closest('[data-ref]');if(marker)selectRefs([marker.dataset.ref],false,true)});
$('part-markers').addEventListener('keydown',e=>{const marker=e.target.closest('[data-ref]');if(marker&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectRefs([marker.dataset.ref],true,true)}});
$('detail').addEventListener('click',e=>{const b=e.target.closest('[data-detail-ref]');if(b)selectRefs([b.dataset.detailRef])});
$('detail').addEventListener('input',e=>{const ref=state.selected[0];if(e.target.id==='actual-value')state.records[ref]={...record(ref),actual:e.target.value};else if(e.target.id==='record-memo')state.records[ref]={...record(ref),memo:e.target.value};else return;save()});
$('search').addEventListener('input',e=>{state.query=e.target.value;renderTable();drawMarkers()});$('clear-search').onclick=()=>{state.query='';$('search').value='';renderTable();drawMarkers();$('search').focus()};
document.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>{state.kind=button.dataset.kind;document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b===button));renderTable();drawMarkers()});
$('package-filter').onchange=e=>{state.pkg=e.target.value;renderTable();drawMarkers()};$('status-filter').onchange=e=>{state.status=e.target.value;renderTable();drawMarkers()};
function grouped(value){state.grouped=value;$('single-view').classList.toggle('active',!value);$('group-view').classList.toggle('active',value);renderTable()};$('single-view').onclick=()=>grouped(false);$('group-view').onclick=()=>grouped(true);
$('show-labels').onchange=drawMarkers;$('power-view').onclick=()=>setView(52,20,182,169);$('full-view').onclick=()=>setView(-8,-8,410,213);
function zoom(factor,ax=.5,ay=.5){const[x,y,w,h]=getView(),nw=w*factor,nh=h*factor;if(nw<25||nw>900)return;setView(x+w*ax-nw*ax,y+h*ay-nh*ay,nw,nh)}$('zoom-in').onclick=()=>zoom(.78);$('zoom-out').onclick=()=>zoom(1.28);
function svgPoint(e){const svg=$('board'),point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;return point.matrixTransform(svg.getScreenCTM().inverse())}
$('board').addEventListener('wheel',e=>{e.preventDefault();const[x,y,w,h]=getView(),point=svgPoint(e);zoom(e.deltaY>0?1.14:.877,(point.x-x)/w,(point.y-y)/h)},{passive:false});
$('board').addEventListener('pointerdown',e=>{if(e.target.closest('[data-ref]')||e.button!==0)return;const point=svgPoint(e);pan={point,view:getView(),pointer:e.pointerId};$('board').setPointerCapture(e.pointerId);$('board').classList.add('dragging')});
$('board').addEventListener('pointermove',e=>{if(!pan)return;const svg=$('board'),current=getView();setView(...pan.view);const point=svgPoint(e);setView(pan.view[0]+pan.point.x-point.x,pan.view[1]+pan.point.y-point.y,pan.view[2],pan.view[3])});
function endPan(){pan=null;$('board').classList.remove('dragging')}$('board').addEventListener('pointerup',endPan);$('board').addEventListener('pointercancel',endPan);
$('export-record').onclick=()=>{const doc={title:'PCB1 电阻电容核对记录',exportedAt:new Date().toISOString(),basis:'每口5V/3A，降压级预留4A；反馈82kΩ+11.1kΩ',items:parts.map(p=>({位号:p.ref,建议值:p.value,原封装:p.package,规格:p.rating,已核对:!!record(p.ref).checked,实装值:record(p.ref).actual||'',备注:record(p.ref).memo||'',选型说明:p.note}))};const url=URL.createObjectURL(new Blob([JSON.stringify(doc,null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='PCB1_阻容核对记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('核对记录已导出')};
$('print').onclick=()=>window.print();
$('reset-record').onclick=()=>{if(undoRecords){state.records=undoRecords;undoRecords=null;$('reset-record').textContent='清空勾选';save();render();toast('已恢复勾选')}else{undoRecords=JSON.parse(JSON.stringify(state.records));for(const p of parts)state.records[p.ref]={...record(p.ref),checked:false};$('reset-record').textContent='撤销清空';save();render();toast('勾选已清空，实装记录保留；可以撤销')}};
render();
</script>
</body>
